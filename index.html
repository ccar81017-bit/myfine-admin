<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MyFine Admin Panel</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --primary: var(--tg-theme-button-color, #3390ec);
            --primary-text: var(--tg-theme-button-text-color, #ffffff);
            --bg: var(--tg-theme-bg-color, #f0f2f5);
            --card-bg: var(--tg-theme-secondary-bg-color, #ffffff);
            --text: var(--tg-theme-text-color, #222);
            --hint: var(--tg-theme-hint-color, #999);
            --error: #e74c3c;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 400px;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 { 
            text-align: center; 
            color: var(--primary); 
            margin: 0 0 24px 0;
            font-size: 22px;
            font-weight: 700;
        }

        .input-group { 
            margin-bottom: 18px; 
            position: relative;
        }

        label { 
            display: block; 
            font-size: 12px; 
            margin-bottom: 6px; 
            font-weight: 600; 
            color: var(--hint);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        input {
            width: 100%; 
            padding: 12px 14px; 
            border-radius: 12px;
            border: 1.5px solid rgba(0,0,0,0.05); 
            background: var(--bg);
            color: var(--text); 
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--primary);
        }

        .toggle-pass {
            position: absolute;
            right: 12px;
            cursor: pointer;
            font-size: 18px;
            user-select: none;
            opacity: 0.6;
        }

        .rule-btn {
            display: block; 
            width: 100%; 
            padding: 14px; 
            margin: 10px 0;
            border: none; 
            border-radius: 12px;
            background-color: var(--primary);
            color: var(--primary-text); 
            font-weight: 600; 
            font-size: 15px;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }

        .rule-btn:active { 
            transform: scale(0.98);
            opacity: 0.9; 
        }

        .forgot-password {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: var(--hint);
        }

        .forgot-password a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .logout-btn {
            background: transparent;
            color: var(--error);
            border: none;
            width: 100%;
            margin-top: 15px;
            padding: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
        }

        .error-msg { 
            color: var(--error); 
            font-size: 13px; 
            text-align: center; 
            margin-bottom: 12px;
            display: none;
        }

        hr { border: 0; border-top: 1px solid rgba(0,0,0,0.05); margin: 20px 0; }
        .hidden { display: none; }
        .btn-orange { background: #f39c12 !important; }
    </style>
</head>
<body>

    <div id="login-screen" class="card">
        <h2>Вход в MyFine ✨</h2>
        <div id="login-error" class="error-msg">Неверный логин или пароль</div>
        
        <div class="input-group">
            <label>Логин</label>
            <div class="input-wrapper">
                <input type="text" id="username" placeholder="Введите ваш логин">
            </div>
        </div>

        <div class="input-group">
            <label>Пароль</label>
            <div class="input-wrapper">
                <input type="password" id="password" placeholder="Введите ваш пароль">
                <span class="toggle-pass" onclick="togglePassword()">👁️</span>
            </div>
        </div>

        <button class="rule-btn" onclick="checkLogin()">Войти</button>
        
        <div class="forgot-password">
            Забыли пароль? Напишите в телеграм <br>
            <a href="https://t.me/artemziv5" target="_blank">@artemziv5</a>
        </div>
    </div>

    <div id="admin-panel" class="card hidden">
        <h2 id="welcome-text">Панель админа</h2>
        
        <div class="input-group">
            <label>ID НАРУШИТЕЛЯ</label>
            <input type="text" id="target_user" placeholder="ID или @username">
        </div>

        <div class="input-group">
            <label>СВОЁ ВРЕМЯ (МИНУТЫ)</label>
            <input type="number" id="custom_time" placeholder="Для кастомного мута">
        </div>

        <hr>
        
        <button class="rule-btn" onclick="sendRule('1')">🤬 Мат (3 часа)</button>
        <button class="rule-btn" onclick="sendRule('2')">🚫 Оскорбления (5 часов)</button>
        <button class="rule-btn" onclick="sendRule('3')">🛑 Спам (2 часа)</button>
        <button class="rule-btn" onclick="sendRule('5')">ℹ️ Оффтоп (Варн)</button>
        <button class="rule-btn btn-orange" onclick="sendRule('custom')">⚡ Применить кастомное</button>
        
        <button class="logout-btn" onclick="logout()">Выйти из профиля</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const users = {
            "nullkotek": "garte454",
            "kisyna123": "sorokmura"
        };

        // ПРОВЕРКА СОХРАНЕННОЙ СЕССИИ ПРИ ЗАГРУЗКЕ
        window.onload = function() {
            const savedUser = localStorage.getItem('myfine_session');
            if (savedUser && users[savedUser]) {
                showPanel(savedUser);
            }
        };

        function togglePassword() {
            const p = document.getElementById('password');
            p.type = p.type === 'password' ? 'text' : 'password';
        }

        function checkLogin() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            const err = document.getElementById('login-error');

            if (users[user] && users[user] === pass) {
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                
                // СОХРАНЕНИЕ УЧЕТНОЙ ЗАПИСИ
                localStorage.setItem('myfine_session', user);
                showPanel(user);
            } else {
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                err.style.display = 'block';
                setTimeout(() => { err.style.display = 'none'; }, 3000);
            }
        }

        function showPanel(name) {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('admin-panel').classList.remove('hidden');
            document.getElementById('welcome-text').innerText = "Привет, " + name + "!";
        }

        function logout() {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            
            // УДАЛЕНИЕ СОХРАНЕННОЙ СЕССИИ
            localStorage.removeItem('myfine_session');
            location.reload();
        }

        function sendRule(ruleId) {
            const target = document.getElementById('target_user').value.trim();
            const time = document.getElementById('custom_time').value.trim();

            if (!target) {
                tg.showAlert("Укажите нарушителя!");
                return;
            }

            const data = {
                action: 'mute',
                target: target,
                rule: ruleId,
                custom_minutes: time
            };

            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            tg.sendData(JSON.stringify(data));
            tg.close();
        }
    </script>
</body>
</html>

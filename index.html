<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyFine Admin Panel</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --primary: var(--tg-theme-button-color, #3390ec);
            --text: var(--tg-theme-text-color, #222);
            --bg: var(--tg-theme-bg-color, #f0f2f5);
            --card-bg: var(--tg-theme-secondary-bg-color, #ffffff);
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .card {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }

        h2 { text-align: center; color: var(--primary); margin-bottom: 20px; }

        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 11px; margin-bottom: 5px; font-weight: bold; opacity: 0.7; }
        input {
            width: 100%; padding: 12px; border-radius: 8px;
            border: 1px solid #ccc; background: var(--bg);
            color: var(--text); box-sizing: border-box; outline: none;
        }

        .rule-btn {
            display: block; width: 100%; padding: 12px; margin: 8px 0;
            border: none; border-radius: 10px;
            background-color: var(--primary);
            color: #fff; font-weight: bold; cursor: pointer;
        }
        .rule-btn:active { opacity: 0.7; }
        
        .forgot-password {
            text-align: center;
            margin-top: 15px;
            font-size: 13px;
            opacity: 0.8;
        }
        .forgot-password a {
            color: var(--primary);
            text-decoration: none;
            font-weight: bold;
        }

        .logout-btn {
            background: transparent;
            color: #e74c3c;
            border: none;
            width: 100%;
            margin-top: 10px;
            cursor: pointer;
            font-size: 13px;
        }

        .hidden { display: none; }
        .error { color: #e74c3c; font-size: 12px; text-align: center; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div id="login-screen" class="card">
        <h2>Вход в MyFine ✨</h2>
        <div id="login-error" class="error"></div>
        <div class="input-group">
            <label>ЛОГИН</label>
            <input type="text" id="username" placeholder="Введите логин">
        </div>
        <div class="input-group">
            <label>ПАРОЛЬ</label>
            <input type="password" id="password" placeholder="Введите пароль">
        </div>
        <button class="rule-btn" onclick="checkLogin()">Войти</button>
        
        <div class="forgot-password">
            Забыли пароль? Напишите в телеграм <a href="https://t.me/artemziv5" target="_blank">@artemziv5</a>
        </div>
    </div>

    <div id="admin-panel" class="card hidden">
        <h2 id="welcome-text">Панель админа</h2>
        
        <div class="input-group">
            <label>ID НАРУШИТЕЛЯ</label>
            <input type="text" id="target_user" placeholder="ID или @username">
        </div>

        <div class="input-group">
            <label>СВОЁ ВРЕМЯ (МИНУТЫ)</label>
            <input type="number" id="custom_time" placeholder="Для кастомного мута">
        </div>

        <hr style="opacity: 0.2; margin: 20px 0;">
        
        <button class="rule-btn" onclick="sendRule('1')">🤬 Мат (3 часа)</button>
        <button class="rule-btn" onclick="sendRule('2')">🚫 Оскорбления (5 часов)</button>
        <button class="rule-btn" onclick="sendRule('3')">🛑 Спам (2 часа)</button>
        <button class="rule-btn" onclick="sendRule('5')">ℹ️ Оффтоп (Варн)</button>
        <button class="rule-btn" style="background:#e67e22" onclick="sendRule('custom')">⚡ Применить кастомное</button>
        
        <button class="logout-btn" onclick="logout()">Выйти из аккаунта</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const users = {
            "nullkotek": "garte454",
            "kisyna123": "sorokmura"
        };

        window.onload = function() {
            const savedUser = localStorage.getItem('myfine_auth');
            if (savedUser && users[savedUser]) {
                renderAdminPanel(savedUser);
            }
        };

        function checkLogin() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            const err = document.getElementById('login-error');

            if (users[user] && users[user] === pass) {
                localStorage.setItem('myfine_auth', user);
                renderAdminPanel(user);
            } else {
                err.innerText = "Неверный логин или пароль!";
            }
        }

        function renderAdminPanel(username) {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('admin-panel').classList.remove('hidden');
            document.getElementById('welcome-text').innerText = "Привет, " + username + "!";
        }

        function logout() {
            localStorage.removeItem('myfine_auth');
            location.reload();
        }

        function sendRule(ruleId) {
            const target = document.getElementById('target_user').value.trim();
            const time = document.getElementById('custom_time').value.trim();

            if (!target) {
                tg.showAlert("Укажите, кого наказываем!");
                return;
            }

            const data = {
                action: 'mute',
                target: target,
                rule: ruleId,
                custom_minutes: time
            };

            tg.sendData(JSON.stringify(data));
            tg.close();
        }
    </script>
</body>
</html>
